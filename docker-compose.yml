services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cti
      MYSQL_USER: cti
      MYSQL_PASSWORD: cti
      TZ: UTC
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - cti-mysql:/var/lib/mysql
      - ./sql/xxl_job_2.4.0.sql:/docker-entrypoint-initdb.d/01-xxl_job.sql:ro
      - ./sql/xxl_job_cti_seed.sql:/docker-entrypoint-initdb.d/02-xxl_job_cti.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=UTC
        --spring.datasource.username=root
        --spring.datasource.password=root
        --spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
        --xxl.job.accessToken=default_token
    ports:
      - "8088:8080"
    volumes:
      - cti-xxl-logs:/data/applogs

volumes:
  cti-mysql:
  cti-xxl-logs:
